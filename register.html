
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Phishing Website Detection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f0ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-container {
            width: 100%;
            max-width: 470px;
        }

        .register-card {
            background: white;
            border-radius: 22px;
            padding: 40px 45px;
            box-shadow: 0 15px 45px rgba(37, 33, 95, 0.12);
        }

        .logo-box {
            width: 62px;
            height: 62px;
            margin: 0 auto 20px;
            border-radius: 17px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .title {
            text-align: center;
            color: #172554;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #172554;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            color: #1e293b;
            background: #ffffff;
            transition: 0.2s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .register-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #5b4ee8);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 22px;
            padding: 13px;
            background: #f1f5ff;
            border-radius: 10px;
            text-align: center;
            color: #475569;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 520px) {
            .register-card {
                padding: 32px 25px;
            }

            .title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="register-card">

            <div class="logo-box">🛡️</div>

            <h1 class="title">Create Account</h1>

            <p class="subtitle">
                Join the AI-Based Phishing Detection System
            </p>

            <form method="POST" action="/register">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

            <div class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </div>

            <div class="security-note">
                🔒 Your account is protected by the application authentication system.
            </div>

        </div>

        <div class="footer">
            AI-Based Phishing Website Detection System
        </div>
    </div>
</body>
</html>
